model_name: resnet18
num_classes: 11

train_dir: food-11_sample/training/labeled
val_dir: food-11_sample/validation
unlabeled_dir: food-11_sample/training/unlabeled

image_size: 224
batch_size: 32
num_workers: 4

epochs: 10
learning_rate: 0.0001
weight_decay: 0.0001
linear_probe: false
use_pretrained: false

device: auto
seed: 0
val_every_n_epochs: 1

checkpoint_dir: model_save
checkpoint_name: model.pth
save_best_only: true

semi_supervised:
  enabled: true
  refresh_interval: 10
  confidence_threshold: 0.99
  activation_threshold: 0.7
