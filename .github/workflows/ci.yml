name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only torch
        # The default PyPI wheels pull in ~2GB of CUDA libraries that CI
        # never uses; the cpu index keeps installs fast.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: pip install -e ".[dev,food101]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -q --cov=food_recognition --cov-report=term-missing

      - name: Smoke test - train, evaluate and predict end to end
        run: |
          python scripts/make_sample_data.py --output data/sample
          food-recognition-train --config configs/smoke_test.yaml
          food-recognition-eval \
            --checkpoint runs/smoke/checkpoints/best.pt \
            --data-dir data/sample/validation \
            --num-workers 0
          food-recognition-predict \
            --checkpoint runs/smoke/checkpoints/best.pt \
            --input data/sample/training/unlabeled

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
