[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "food-recognition"
version = "0.3.1"
description = "Food image classification with PyTorch: CBAM attention, self-training and reproducible CLI workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "linhongyu510" }]
keywords = ["deep-learning", "pytorch", "image-classification", "food-101", "cbam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # torch>=2.4 is required for the unified torch.amp.GradScaler("cuda", ...) API.
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.21",
    "Pillow>=9.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]
viz = ["matplotlib>=3.5"]
download = ["kagglehub>=0.2"]
food101 = ["pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/linhongyu510/food_recognition"
Repository = "https://github.com/linhongyu510/food_recognition"
Issues = "https://github.com/linhongyu510/food_recognition/issues"

[project.scripts]
food-recognition-train = "food_recognition.cli:train_main"
food-recognition-eval = "food_recognition.cli:eval_main"
food-recognition-predict = "food_recognition.cli:predict_main"
food-recognition-gradcam = "food_recognition.cli:gradcam_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"experiments/**" = ["ALL"]
"legacy/**" = ["ALL"]
